context:
  version: "5.1.0"

package:
  name: lockfile-lint
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/lockfile-lint/-/lockfile-lint-${{ version }}.tgz
  sha256: 6eb6283a2aa3d9882d823398c61273efdfafc91fcacafed494d9c57195cb3fac

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - lockfile-lint --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A CLI to lint a lockfile for security policies
  homepage: https://github.com/lirantal/lockfile-lint
  repository: https://github.com/lirantal/lockfile-lint

extra:
  recipe-maintainers:
    - danielnachun
