context:
  version: "5.0.1"

package:
  name: lockfile-lint
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/lockfile-lint/-/lockfile-lint-${{ version }}.tgz
  sha256: 1096d4cbe06e0df24ed63c629c458ec60888866994f74c69483920dc25ade0a8

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - lockfile-lint --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A CLI to lint a lockfile for security policies
  homepage: https://github.com/lirantal/lockfile-lint
  repository: https://github.com/lirantal/lockfile-lint

extra:
  recipe-maintainers:
    - danielnachun
