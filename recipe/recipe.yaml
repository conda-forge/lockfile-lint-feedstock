context:
  version: "5.1.1"

package:
  name: lockfile-lint
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/lockfile-lint/-/lockfile-lint-${{ version }}.tgz
  sha256: 9dba33ee47b86b60191c2951a4552499b530395d6fd2e1f959741a78ac802c05

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - lockfile-lint --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: A CLI to lint a lockfile for security policies
  homepage: https://github.com/lirantal/lockfile-lint
  repository: https://github.com/lirantal/lockfile-lint

extra:
  recipe-maintainers:
    - danielnachun
